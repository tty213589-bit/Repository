name: Build Sabay Shop Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'sabay-shop-native/**'
      - '.github/workflows/sabay-shop-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install dependencies
        working-directory: sabay-shop-native
        run: npm install
      - name: Create Android project
        working-directory: sabay-shop-native
        run: npx cap add android
      - name: Sync web app
        working-directory: sabay-shop-native
        run: npx cap sync android
      - name: Build debug APK
        working-directory: sabay-shop-native/android
        run: ./gradlew assembleDebug
      - name: Copy APK
        run: cp sabay-shop-native/android/app/build/outputs/apk/debug/app-debug.apk Sabay-Shop-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sabay-Shop-Android
          path: Sabay-Shop-Android.apk
          retention-days: 30
