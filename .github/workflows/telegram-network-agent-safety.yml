name: Telegram Network Agent Safety

on:
  push:
    paths:
      - 'telegram-network-agent/**'
      - '.github/workflows/telegram-network-agent-safety.yml'
  pull_request:
    paths:
      - 'telegram-network-agent/**'
      - '.github/workflows/telegram-network-agent-safety.yml'

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bot dependencies
        run: python -m pip install --disable-pip-version-check -r telegram-network-agent/requirements.txt

      - name: Syntax check
        run: python -m compileall -q telegram-network-agent

      - name: Import smoke test
        working-directory: telegram-network-agent
        run: python -c "import agent, bot, network; print('imports ok')"

      - name: Read-only safety tests
        run: python -m unittest discover -s telegram-network-agent/tests -p 'test_*.py'
