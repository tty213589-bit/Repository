name: Security hotfix - remove public admin secrets

on:
  push:
    paths:
      - '.github/workflows/security-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove unsafe client-side admin credentials
        shell: python
        run: |
          from pathlib import Path
          import re

          app_path = Path('iphone-custom-studio/App.jsx')
          app = app_path.read_text(encoding='utf-8')

          old_auth = 'onAuth={() => setAdminAuthed(adminPw === "admin123")}'
          new_auth = 'onAuth={() => { setAdminAuthed(false); window.alert("Admin access is temporarily disabled until secure server authentication is configured."); }}'
          if old_auth not in app:
              raise SystemExit('Expected hard-coded admin auth pattern not found; refusing unsafe edit.')
          app = app.replace(old_auth, new_auth, 1)

          old_hint = 'placeholder="Password (hint: admin123)"'
          if old_hint not in app:
              raise SystemExit('Expected public password hint not found; refusing unsafe edit.')
          app = app.replace(old_hint, 'placeholder="Admin access disabled" disabled', 1)
          app_path.write_text(app, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"\n  const ADMIN_PASSWORD_HASH = '[0-9a-fA-F]{64}';\n  async function requestAdminAccess\(\)\{.*?\n  \}\n  adminToggle\.addEventListener\('click', requestAdminAccess\);",
              re.S,
          )
          replacement = "\n  async function requestAdminAccess(){\n    window.alert('Admin settings are temporarily disabled until secure server authentication is configured.');\n  }\n  adminToggle.addEventListener('click', requestAdminAccess);"
          index, count = pattern.subn(replacement, index, count=1)
          if count != 1:
              raise SystemExit('Expected public admin hash block not found; refusing unsafe edit.')
          index_path.write_text(index, encoding='utf-8')

          combined = app_path.read_text(encoding='utf-8') + '\n' + index_path.read_text(encoding='utf-8')
          forbidden = ['admin123', 'ADMIN_PASSWORD_HASH']
          remaining = [item for item in forbidden if item in combined]
          if remaining:
              raise SystemExit(f'Dangerous public admin patterns still present: {remaining}')

      - name: Commit security fix
        shell: bash
        run: |
          git config user.name "security-hotfix"
          git config user.email "security-hotfix@users.noreply.github.com"
          git add iphone-custom-studio/App.jsx index.html
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "security: remove public client-side admin credentials"
          git push
